name: Regenerate bindings

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately not go-version-file: go.mod. The generators format
      # their output with go/format, so the toolchain running them decides
      # what the committed *_gen.go files look like - pinning that to the
      # module's minimum (1.16, whose gofmt predates the Go 1.19 doc-comment
      # rules) would rewrite every generated file on each run. The library's
      # minimum-version guarantee is covered by test.yml's matrix instead.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Fetch current xenapi.json
        id: fetch
        run: |
          curl -sL -o xenapi.json.new https://raw.githubusercontent.com/xapi-project/xapi-project.github.io/master/_data/xenapi.json
          if cmp -s xenapi.json xenapi.json.new; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "xenapi.json unchanged, nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mv xenapi.json.new xenapi.json
          fi

      - name: Regenerate bindings
        if: steps.fetch.outputs.changed == 'true'
        run: |
          go get github.com/serenize/snaker
          rm -f *_gen.go
          go run xenapi.go
          go mod tidy

      - name: Regenerate error.go from upstream error definitions
        if: steps.fetch.outputs.changed == 'true'
        run: go run gen_errors.go

      - name: Update SchemaXAPIRelease constant
        if: steps.fetch.outputs.changed == 'true'
        run: go run update_schema_release.go

      - name: Build, vet, and test
        if: steps.fetch.outputs.changed == 'true'
        run: |
          go build ./...
          go vet ./...
          go test -short ./...

      - name: Commit, tag, push, and release
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "regeneration produced no file changes; skipping commit"
            exit 0
          fi

          RELEASE=$(grep -oP '(?<=const SchemaXAPIRelease = ")[^"]+' client.go)

          git add -A
          git commit -m "Auto-regenerate bindings from updated xenapi.json (XAPI release ${RELEASE})"

          LATEST_TAG=$(git describe --tags --abbrev=0)
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F. '{ major = substr($1, 2); minor = $2 + 1; printf "v%s.%s.0", major, minor }')

          git tag -a "$NEW_TAG" -m "$NEW_TAG

          Auto-regenerated from XAPI release ${RELEASE}."

          git push origin main
          git push origin "$NEW_TAG"

          # One release per regeneration, so the release list matches the tag
          # history. Gated on an actual schema change above, so no-op runs
          # create nothing. Idempotent against re-runs.
          cat > /tmp/release-notes.md <<EOF
          Automated schema regeneration - no hand-written code change.

          - xenapi.SchemaXAPIRelease: ${RELEASE}
          - Generated bindings refreshed from xenapi.json.

          **Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${LATEST_TAG}...${NEW_TAG}
          EOF

          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "release $NEW_TAG already exists; leaving it untouched"
          else
            gh release create "$NEW_TAG" \
              --title "$NEW_TAG - Regenerated bindings (XAPI ${RELEASE})" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Open an issue if the run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Automated regeneration failed (run ${context.runId})`,
              body: [
                'The scheduled bindings-regeneration workflow failed.',
                '',
                'Likely cause: xenapi.json introduced a new schema construct that ' +
                'xenapi.go does not know how to map yet (the same kind of case ' +
                'handled manually before for lifecycle/event-batch/option types) ' +
                '- generation panics with a message naming the offending type ' +
                'string, which needs a case added in goTypeForXenType, ' +
                'funcPartialForXenType, and buildConverterFunc.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
