name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  # regenerate.yml runs these checks on its branch before merging.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # go.mod's minimum and the current release; keep the first in sync with go.mod.
        go-version: ['1.25', 'stable']
    name: Go ${{ matrix.go-version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -short: the package has no test that needs it today, but it keeps
      # any future live-host test from becoming an accidental CI dependency.
      - name: Test
        run: go test -short -race ./...

      - name: Fuzz the XML-RPC decoder
        if: matrix.go-version == 'stable'
        run: go test -run '^$' -fuzz FuzzDecodeResponse -fuzztime 30s ./xmlrpc

  # Separate from the matrix: gofmt's own rules change between Go releases
  # (Go 1.19 reformatted doc comments, for one), so the check has to run on
  # one toolchain - the same "stable" the generators run under in
  # regenerate.yml, since they format their output with go/format.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: gofmt
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo
            echo "Generated files are formatted by the generator itself - if a"
            echo "*_gen.go file is listed here, regenerate rather than hand-format."
            gofmt -d .
            exit 1
          fi
