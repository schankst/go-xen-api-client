name: Regenerate bindings

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The generators format their output with go/format, so generate with
      # the same toolchain the gofmt check in test.yml uses.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # SchemaXAPIRelease is the single place the verified-against release is
      # stated (see client.go); the docs deliberately point at it instead of
      # repeating a number, because this workflow changes that number every
      # time it runs. Runs on every invocation, including the ones where
      # xenapi.json is unchanged and everything else is skipped - a literal
      # creeping into the docs is a problem regardless of whether this week's
      # schema moved, and putting it behind the "changed" gate below meant it
      # was never exercised at all on a no-op run.
      - name: Check docs don't hardcode the schema release
        run: |
          RELEASE=$(grep -oP '(?<=const SchemaXAPIRelease = ")[^"]+' client.go)
          BASE=${RELEASE%-next}
          if grep -nE "\b${BASE//./\\.}(-next)?\b" README.md MAINTAINING.md GOOD_TO_KNOW.md \
               IMPORT_EXPORT.md PERFORMANCE.md UPDATES_AND_PATCHES.md LICENSING.md; then
            echo "Docs hardcode the schema release ($RELEASE)."
            echo "Point at xenapi.SchemaXAPIRelease instead - it changes on every run."
            exit 1
          fi

      - name: Fetch current xenapi.json
        id: fetch
        run: |
          curl -sL -o xenapi.json.new https://raw.githubusercontent.com/xapi-project/xapi-project.github.io/master/_data/xenapi.json
          if cmp -s xenapi.json xenapi.json.new; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "xenapi.json unchanged, nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            mv xenapi.json.new xenapi.json
          fi

      - name: Regenerate bindings
        if: steps.fetch.outputs.changed == 'true'
        run: |
          rm -f *_gen.go
          go generate ./...

      - name: Regenerate error.go from upstream error definitions
        if: steps.fetch.outputs.changed == 'true'
        run: go run ./internal/cmd/generrors

      - name: Update SchemaXAPIRelease constant
        if: steps.fetch.outputs.changed == 'true'
        run: go run ./internal/cmd/schemarelease

      - name: Build, vet, and test
        if: steps.fetch.outputs.changed == 'true'
        run: |
          go build ./...
          go vet ./...
          go test -short ./...

      - name: Commit, tag, push, and release
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "regeneration produced no file changes; skipping commit"
            exit 0
          fi

          RELEASE=$(grep -oP '(?<=const SchemaXAPIRelease = ")[^"]+' client.go)

          git add -A
          git commit -m "Auto-regenerate bindings from updated xenapi.json (XAPI release ${RELEASE})"

          LATEST_TAG=$(git describe --tags --abbrev=0)
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F. '{ major = substr($1, 2); minor = $2 + 1; printf "v%s.%s.0", major, minor }')

          git tag -a "$NEW_TAG" -m "$NEW_TAG

          Auto-regenerated from XAPI release ${RELEASE}."

          git push origin main
          git push origin "$NEW_TAG"

          # One release per regeneration, so the release list matches the tag
          # history. Gated on an actual schema change above, so no-op runs
          # create nothing. Idempotent against re-runs.
          cat > /tmp/release-notes.md <<EOF
          Automated schema regeneration - no hand-written code change.

          - xenapi.SchemaXAPIRelease: ${RELEASE}
          - Generated bindings refreshed from xenapi.json.

          **Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${LATEST_TAG}...${NEW_TAG}
          EOF

          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "release $NEW_TAG already exists; leaving it untouched"
          else
            gh release create "$NEW_TAG" \
              --title "$NEW_TAG - Regenerated bindings (XAPI ${RELEASE})" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi

      - name: Open an issue if the run failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Automated regeneration failed (run ${context.runId})`,
              body: [
                'The scheduled bindings-regeneration workflow failed.',
                '',
                'Likely cause: xenapi.json introduced a new schema construct that ' +
                'internal/cmd/genapi does not know how to map yet (the same kind of case ' +
                'handled manually before for lifecycle/event-batch/option types) ' +
                '- generation panics with a message naming the offending type ' +
                'string, which needs a case added in goTypeForXenType, ' +
                'funcPartialForXenType, and buildConverterFunc.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            })
