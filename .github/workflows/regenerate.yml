name: Regenerate bindings

# Weekly: regenerate from the upstream schema and error definitions, open
# a PR, run test.yml on it, and merge, tag and release only if it passes.
# The checks are called directly because PRs opened with GITHUB_TOKEN
# don't trigger other workflows.

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      pr: ${{ steps.pr.outputs.pr }}
      release: ${{ steps.pr.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      # Same toolchain as test.yml's gofmt check, since the generators
      # format their output with go/format.
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # Always regenerate: either source can change, and so can the
      # generators. The next step stops if nothing changed.
      - name: Regenerate
        run: |
          curl -fsSL --retry 3 -o xenapi.json \
            https://raw.githubusercontent.com/xapi-project/xapi-project.github.io/master/_data/xenapi.json
          rm -f *_gen.go
          go generate ./...
          go run ./internal/cmd/generrors
          go run ./internal/cmd/schemarelease

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "regeneration produced no changes"
            exit 0
          fi
          release=$(grep -oP '(?<=const SchemaXAPIRelease = ")[^"]+' client.go)
          branch="regenerate/${release}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "Regenerate bindings from xenapi.json (XAPI release ${release})"
          git push origin "$branch"

          # Supersede earlier regeneration PRs left open by failed runs.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("regenerate/")) | .number' |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Superseded by a newer regeneration run."
            done

          pr=$(gh pr create --base main --head "$branch" \
            --title "Regenerate bindings (XAPI release ${release})" \
            --body "Automated regeneration from the upstream xenapi.json and error definitions. Merged by [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) once test.yml passes on the branch.")
          {
            echo "branch=$branch"
            echo "pr=$pr"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: regenerate
    if: needs.regenerate.outputs.pr != ''
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.regenerate.outputs.branch }}

  release:
    needs: [regenerate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.regenerate.outputs.pr }}
          RELEASE: ${{ needs.regenerate.outputs.release }}
        run: |
          gh pr merge "$PR" --rebase --delete-branch
          sha=$(gh pr view "$PR" --json mergeCommit -q .mergeCommit.oid)
          git fetch origin main --tags

          latest=$(git describe --tags --abbrev=0 "$sha")
          tag=$(echo "$latest" | awk -F. '{ printf "v%s.%d.0", substr($1, 2), $2 + 1 }')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag" -m "Regenerated from XAPI release ${RELEASE}." "$sha"
          git push origin "$tag"

          gh release create "$tag" --verify-tag --latest \
            --title "$tag - Regenerated bindings (XAPI ${RELEASE})" \
            --notes "Automated regeneration ($PR).

          - xenapi.SchemaXAPIRelease: ${RELEASE}

          **Full diff**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${latest}...${tag}"

  report-failure:
    needs: [regenerate, test, release]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.regenerate.outputs.pr }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Automated regeneration failed (run ${GITHUB_RUN_ID})" \
            --body "The bindings regeneration failed: $RUN
          ${PR:+
          The regenerated code is in $PR.}

          A common cause is a new type construct in xenapi.json that internal/cmd/genapi can't map yet; generation then fails naming the type (see MAINTAINING.md)."
